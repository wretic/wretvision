<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PCX90839K8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-PCX90839K8');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WretVision — Movie, TV &amp; Game Reviews</title>
  <meta name="description" content="WretVision — Honest reviews of movies, TV shows, and games. Obscure picks, forgotten classics, cult films. If it stuck with me, it ends up here." />
  <meta name="keywords" content="movie reviews, TV show reviews, game reviews, cult films, horror, sci-fi, action, hidden gems" />
  <meta name="author" content="WretVision" />
  <link rel="canonical" href="https://wretvision.com/" />
  <meta property="og:title" content="WretVision — Movie, TV &amp; Game Reviews" />
  <meta property="og:description" content="Honest reviews of movies, TV shows, and games. If it stuck with me, it ends up here." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wretvision.com/" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "WretVision",
    "url": "https://wretvision.com",
    "description": "Honest reviews of movies, TV shows, and games.",
    "author": { "@type": "Person", "name": "WretVision" }
  }
  </script>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <!-- Universal Header -->
  <header class="site-header">
    <div class="site-width site-header-inner">
      <a href="index.html" class="site-logo">WRET<span>VISION</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" class="active">Home</a>
        <a href="movies.html">Movies</a>
        <a href="tv.html">TV</a>
        <a href="games.html">Games</a>
        <a href="horror-vault.html">Horror Vault</a>
        <a href="re-archive/resident-evil.html">Resident Evil</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="search-trigger" title="Search reviews (Press /)" aria-label="Search">🔍</button>
        <button class="icon-btn" id="wl-trigger" title="View Watchlist" aria-label="Saved reviews">
          🔖<span id="wl-badge" class="badge hidden">0</span>
        </button>
        <a class="header-youtube" href="https://youtube.com/@WretVision" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero Spotlight Section -->
    <section class="hero-spotlight">
      <div id="hero-backdrop" class="hero-backdrop" aria-hidden="true"></div>
      <div class="hero-backdrop-overlay" aria-hidden="true"></div>
      <div class="site-width">
        <div class="hero-content">
          <div id="hero-kicker" class="hero-kicker">Latest Review</div>
          <h1 id="hero-title" class="hero-title">Loading...</h1>
          <div id="hero-meta" class="hero-meta"></div>
          <div class="hero-verdict-box">
            <div id="hero-score" class="hero-score">-- <span>/ 10</span></div>
            <p id="hero-verdict" class="hero-verdict-text"></p>
          </div>
          <div class="hero-actions">
            <a id="hero-read-btn" href="#" class="btn-primary">Read Review →</a>
            <a id="hero-video-btn" href="#" class="btn-ghost" target="_blank" rel="noopener" hidden>Watch on YouTube</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Top Rated Showcase -->
    <section class="top-rated-section">
      <div class="site-width">
        <div class="section-header">
          <h2 class="section-title">Top Rated &amp; Essentials</h2>
          <span class="section-sub">Highest scored recommendations (8.5+)</span>
        </div>
        <div class="top-rail-wrap">
          <div id="top-rail" class="top-rail"></div>
        </div>
      </div>
    </section>

    <!-- Review Feed Grid -->
    <section id="reviews-section" style="padding-top: 1rem;">
      <div class="site-width">
        <div class="section-header">
          <h2 class="section-title">All Reviews</h2>
          <span class="section-sub">Browse by category or genre</span>
        </div>

        <div class="feed-controls">
          <div class="pills-group">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="movie"><span class="pill-dot movies"></span> Movies</button>
            <button class="pill" data-filter="tv"><span class="pill-dot tv"></span> TV</button>
            <button class="pill" data-filter="game"><span class="pill-dot games"></span> Games</button>
            <button class="pill" data-filter="saved">🔖 Saved</button>
          </div>
          <select id="genre-select" class="genre-select" aria-label="Filter by genre">
            <option value="">All Genres</option>
          </select>
        </div>

        <div id="review-grid" class="review-grid"></div>
        <div id="pagination-wrap" class="pagination-wrap"></div>
      </div>
    </section>
  </main>

  <!-- Search Modal -->
  <div id="search-modal" class="search-modal" aria-hidden="true">
    <div class="search-box">
      <div class="search-input-wrap">
        <span style="font-size: 1.1rem; opacity: .7;">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search reviews by title, director, or genre..." autocomplete="off">
        <span class="search-hint">ESC</span>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Universal Footer -->
  <footer class="site-footer">
    <div class="site-width">
      <p>© WretVision · Built for the love of film, TV &amp; games</p>
    </div>
  </footer>

  <script src="reviews.js"></script>
  <script src="home.js"></script>
</body>
</html>
